<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">sentinel-forge: a Red vs Blue security testing lab</title>
  <desc id="d">n8n orchestrates an exercise: the Red team runs tagged attacks against target VMs; Wazuh detects them and the Blue team responds; the Purple team scores both in real time. Any activity not originating from the Red Team subnet is flagged as a Black Hat threat and blocked automatically.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#ff4d5e"/><stop offset=".5" stop-color="#9b59ff"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#eceef4; }
    .muted { fill:#8f96a8; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes s1 { 0%,2.73% { opacity:0 } 5.91%,25.00% { opacity:1 } 27.27%,100% { opacity:0 } } .s1 { animation:s1 11.0s infinite; }
    @keyframes s2 { 0%,23.64% { opacity:0 } 26.82%,45.91% { opacity:1 } 48.18%,100% { opacity:0 } } .s2 { animation:s2 11.0s infinite; }
    @keyframes s3 { 0%,44.55% { opacity:0 } 47.73%,66.82% { opacity:1 } 69.09%,100% { opacity:0 } } .s3 { animation:s3 11.0s infinite; }
    @keyframes s4 { 0%,65.45% { opacity:0 } 68.64%,79.55% { opacity:1 } 81.82%,100% { opacity:0 } } .s4 { animation:s4 11.0s infinite; }
    @keyframes bh { 0%,81.82% { opacity:0 } 85.00%,95.91% { opacity:1 } 98.18%,100% { opacity:0 } } .bh { animation:bh 11.0s infinite; }
    @keyframes atk { 0%{offset-distance:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} } .atk{animation:atk 2.6s linear infinite;offset-path:path('M250 150 H 400')}
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; } }
  </style>
  <rect width="960" height="400" rx="20" fill="#0d0f16"/>
  <text x="40" y="54" font-size="28" font-weight="800" style="fill:url(#title)">sentinel-forge</text>
  <text x="42" y="82" font-size="15" class="muted">A Red vs Blue security lab — automated exercises with multi-perspective threat detection.</text>

  <!-- orchestrator bar -->
  <rect x="40" y="104" width="880" height="34" rx="9" fill="#141019" stroke="#3a2f52"/>
  <text x="58" y="126" font-size="12" font-weight="700" style="fill:#c4a6ff">⚙ n8n orchestrator</text>
  <text x="230" y="126" font-size="11" class="muted">schedules the exercise · coordinates teams · 5-min monitoring loop</text>

  <!-- red -->
  <g>
  <rect x="40" y="150" width="210" height="100" rx="12" fill="#1f1114" stroke="#ff4d5e" stroke-opacity=".55"/>
  <text x="60" y="176" font-size="13" font-weight="800" style="fill:#ff8a95">🔴 Red Team</text>
  <text x="60" y="194" font-size="10" class="mono muted">10.0.10.0/24 · Kali · C2</text>
  <g class="s1"><text x="60" y="218" font-size="11" class="muted">recon → exploit → lateral</text>
    <text x="60" y="236" font-size="11" class="muted">→ exfil · <tspan style="fill:#ff8a95">tagged traffic</tspan></text></g>
  </g>
  <circle class="atk" r="5" fill="#ff4d5e"/>

  <!-- target -->
  <rect x="400" y="150" width="160" height="100" rx="12" fill="#13161f" stroke="#2a3344"/>
  <text x="420" y="176" font-size="12" font-weight="800">🎯 Targets</text>
  <text x="420" y="194" font-size="10" class="mono muted">10.0.30.0/24</text>
  <text x="420" y="216" font-size="10.5" class="muted">web · windows</text>
  <text x="420" y="233" font-size="10.5" class="muted">docker · AD</text>

  <!-- blue + wazuh -->
  <g>
  <rect x="580" y="150" width="340" height="100" rx="12" fill="#101722" stroke="#3b82f6" stroke-opacity=".55"/>
  <text x="600" y="176" font-size="13" font-weight="800" style="fill:#7cb0ff">🔵 Blue Team · Wazuh SIEM</text>
  <text x="600" y="194" font-size="10" class="mono muted">10.0.20.0/24 · SOC · MISP · IDS</text>
  <g class="s2"><text x="600" y="218" font-size="11" class="muted">detect in &lt;5 min → block IP →</text>
    <text x="600" y="236" font-size="11" class="muted">isolate host → collect forensics</text></g>
  </g>
  <line x1="560" y1="200" x2="580" y2="200" stroke="#2a3344" stroke-width="2"/>

  <!-- purple scoring -->
  <g class="s3"><rect x="40" y="266" width="520" height="54" rx="12" fill="#17121f" stroke="#9b59ff" stroke-opacity=".5"/>
  <text x="60" y="290" font-size="12.5" font-weight="800" style="fill:#c4a6ff">🟣 Purple Team — real-time scoring</text>
  <text x="60" y="309" font-size="10.5" class="muted">Red: access 100 · persist 200 · exfil 500 · Blue: detect, block, full IR — both scored live</text></g>

  <!-- black hat -->
  <g class="bh"><rect x="40" y="266" width="520" height="54" rx="12" fill="#1a1414" stroke="#ff5c6e"/>
  <text x="60" y="290" font-size="12.5" font-weight="800" style="fill:#ff9ba3">⚫ Black Hat detected — NOT from Red Team subnet!</text>
  <text x="60" y="309" font-size="10.5" class="muted">any traffic ∉ 10.0.10.0/24 → critical alert · auto-block · IR playbook · exec notify</text></g>

  <!-- honeypots -->
  <rect x="580" y="266" width="340" height="54" rx="12" fill="#14130f" stroke="#caa24a" stroke-opacity=".5"/>
  <text x="600" y="290" font-size="12.5" font-weight="800" style="fill:#e4c878">🍯 Honeypots · 10.0.50.0/24</text>
  <text x="600" y="309" font-size="10.5" class="muted">Cowrie SSH · web decoy — any touch is suspicious</text>

  <text x="40" y="350" font-size="11.5" class="muted">Infra by <tspan style="fill:#cdd6e6">Terraform</tspan> on <tspan style="fill:#cdd6e6">Proxmox</tspan> · orchestration by <tspan style="fill:#cdd6e6">n8n</tspan> · detection by <tspan style="fill:#cdd6e6">Wazuh</tspan>. Authorized environments only.</text>
  <text x="40" y="372" font-size="10.5" class="muted">Safe word <tspan class="mono" style="fill:#cdd6e6">STOPEX-REDBLUE-[date]</tspan> in Slack halts all attacks immediately.</text>
</svg>
